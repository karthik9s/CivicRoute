name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit even without code changes

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      EMBEDDING_MODEL: hash      # tests use the offline deterministic embedder
      VECTOR_STORE: memory
      LLM_PROVIDER: none         # no API keys in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.lock pip-audit
      - run: python -m pytest -W error::DeprecationWarning
      - run: python -m pip_audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # Deploy to the Hugging Face Space after both test jobs pass on main.
  # Set up once (DEPLOY.md): repo secret HF_TOKEN (write token) + repo variable HF_SPACE (e.g. karthik9s/civicroute).
  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Push to Hugging Face Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
      - name: Skipped (not configured)
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "Set the HF_TOKEN secret and HF_SPACE variable to enable automatic deployment (see DEPLOY.md)."
