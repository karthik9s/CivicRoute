name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly dependency audit even without code changes

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      EMBEDDING_MODEL: hash      # tests use the offline deterministic embedder
      VECTOR_STORE: memory
      LLM_PROVIDER: none         # no API keys in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements.lock }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.lock pip-audit
      - run: python -m pytest -W error::DeprecationWarning
      - run: python -m pip_audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
