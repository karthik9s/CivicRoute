# Keep the free Render instance awake: it sleeps after 15 min without visitors and then needs
# about 2 minutes to wake. A ping every 10 minutes means visitors almost never wait.
# Uses ~744 of Render's 750 free instance-hours a month (one service running all month).
# GitHub may delay scheduled runs at busy times; an UptimeRobot monitor (DEPLOY.md) is a sturdier backup.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://civicroute-kpid.onrender.com' }}
    steps:
      - name: Ping health endpoint (waits up to 3 min if it was asleep)
        run: curl --silent --show-error --fail --retry 6 --retry-delay 20 --retry-all-errors --max-time 180 "$SITE_URL/api/health"
